<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RdpClient logo">
  <title>RdpClient</title>
  <desc>A monitor showing a remote desktop session, with a link signal in the corner.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="55%" stop-color="#12508F"/>
      <stop offset="100%" stop-color="#0A6FB5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6E9FB"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Monitor body -->
  <rect x="96" y="120" width="320" height="216" rx="24" fill="url(#screen)"/>
  <rect x="118" y="142" width="276" height="172" rx="12" fill="#0C2B4E"/>

  <!-- Remote session content: a window bar and two panes -->
  <rect x="136" y="160" width="240" height="22" rx="6" fill="#1E6FD9"/>
  <rect x="136" y="196" width="112" height="100" rx="8" fill="#17518F"/>
  <rect x="258" y="196" width="118" height="46" rx="8" fill="#1E6FD9"/>
  <rect x="258" y="250" width="118" height="46" rx="8" fill="#2E8BE6"/>

  <!-- Monitor stand -->
  <rect x="216" y="336" width="80" height="34" rx="10" fill="url(#screen)"/>
  <rect x="168" y="366" width="176" height="26" rx="13" fill="#E8F2FD"/>

  <!-- Link signal -->
  <path d="M330 128 a46 46 0 0 1 46 46" fill="none" stroke="#4FC3F7" stroke-width="16" stroke-linecap="round"/>
  <path d="M330 96 a78 78 0 0 1 78 78" fill="none" stroke="#4FC3F7" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
</svg>